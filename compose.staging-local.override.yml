# Local-only override. Do not use this file on staging or production VMs.
services:
  backend:
    volumes: !override
      - bma_staging_local_uploads:/app/uploads

  nginx:
    image: nginx:1.27.5-alpine
    restart: "no"
    ports: !override
      - "8088:80"
    volumes: !override
      - ./nginx/staging-local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy-common.conf:/etc/nginx/proxy-common.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - app_network

networks:
  app_network:

volumes:
  bma_staging_local_uploads:
    name: bma_staging_local_uploads
