# Explicit Project-Nginx mode. Use only after the existing edge proxy has
# been formally approved for replacement.
services:
  nginx:
    image: nginx:1.27.5-alpine
    restart: unless-stopped
    ports:
      # Alternate ports keep the existing bma-nginx available during review.
      # Set both ports explicitly to 80/443 only after an approved cutover.
      - "${PROJECT_EDGE_HTTP_BIND_ADDRESS:-127.0.0.1}:${PROJECT_EDGE_HTTP_PORT:-18080}:80"
      - "${PROJECT_EDGE_HTTPS_BIND_ADDRESS:-127.0.0.1}:${PROJECT_EDGE_HTTPS_PORT:-18443}:443"
    volumes:
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy-common.conf:/etc/nginx/proxy-common.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - app_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
