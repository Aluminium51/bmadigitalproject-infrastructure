name: bma-db-staging

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:15.18-alpine3.24}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_BACKUP_USER: ${POSTGRES_BACKUP_USER:?POSTGRES_BACKUP_USER is required}
      POSTGRES_BACKUP_PASSWORD: ${POSTGRES_BACKUP_PASSWORD:?POSTGRES_BACKUP_PASSWORD is required}
    ports:
      - "${DATABASE_BIND_ADDRESS:?DATABASE_BIND_ADDRESS is required}:${DATABASE_HOST_PORT:?DATABASE_HOST_PORT is required}:5432"
    volumes:
      - bma_staging_pg_data:/var/lib/postgresql/data
    networks:
      - db_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  db_network:

volumes:
  bma_staging_pg_data:
    name: bma_staging_pg_data
