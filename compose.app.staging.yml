name: bma-app-staging

services:
  backend:
    image: ${BACKEND_IMAGE_REPOSITORY:?BACKEND_IMAGE_REPOSITORY is required}:${BACKEND_VERSION:?BACKEND_VERSION is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8081"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      UPLOAD_STORAGE_DIR: /app/uploads
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: lax
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    expose:
      - "8081"
    volumes:
      - bma_staging_uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8081/health/live"
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - app_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    image: ${FRONTEND_IMAGE_REPOSITORY:?FRONTEND_IMAGE_REPOSITORY is required}:${FRONTEND_VERSION:?FRONTEND_VERSION is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api/v1
      BACKEND_URL: http://backend:8081
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: lax
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    image: nginx:1.27.5-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy-common.conf:/etc/nginx/proxy-common.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - app_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  app_network:

volumes:
  bma_staging_uploads:
    name: bma_staging_uploads
