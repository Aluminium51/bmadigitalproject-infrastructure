name: bma-app-staging

services:
  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}:${BACKEND_VERSION:?BACKEND_VERSION is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8081"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      UPLOAD_STORAGE_DIR: /app/uploads
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:?MAX_UPLOAD_SIZE is required}
      TRUST_PROXY: ${TRUST_PROXY:?TRUST_PROXY is required}
      COOKIE_SECURE: ${COOKIE_SECURE:?COOKIE_SECURE is required}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:?COOKIE_SAME_SITE is required}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    expose:
      - "8081"
    volumes:
      - ${UPLOAD_HOST_PATH:?UPLOAD_HOST_PATH is required}:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8081/health/live"
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - app_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}:${FRONTEND_VERSION:?FRONTEND_VERSION is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api/v1
      BACKEND_URL: http://backend:8081
      COOKIE_SECURE: ${COOKIE_SECURE:?COOKIE_SECURE is required}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:?COOKIE_SAME_SITE is required}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  app_network:
