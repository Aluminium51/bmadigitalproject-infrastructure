map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

log_format staging_main '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'host="$http_host" forwarded_host="$http_x_forwarded_host"';

access_log /var/log/nginx/access.log staging_main;
error_log /var/log/nginx/error.log warn;

server {
    listen 80;
    server_name _;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    client_max_body_size 30m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /health/live {
        proxy_pass http://backend:8081/health/live;
        include /etc/nginx/proxy-common.conf;
    }

    location = /health/ready {
        proxy_pass http://backend:8081/health/ready;
        include /etc/nginx/proxy-common.conf;
    }

    location = /openapi-v1.json {
        proxy_pass http://backend:8081/openapi-v1.json;
        include /etc/nginx/proxy-common.conf;
    }

    location ^~ /docs/ {
        proxy_pass http://backend:8081;
        include /etc/nginx/proxy-common.conf;
    }

    location ^~ /api/v1/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        include /etc/nginx/proxy-common.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        include /etc/nginx/proxy-common.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
